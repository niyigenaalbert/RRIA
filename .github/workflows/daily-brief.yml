name: Daily Revenue Intelligence Brief

on:
  schedule:
    # 07:00 UTC = 09:00 Kigali (CAT, UTC+2, no DST)
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the brief without emailing"
        type: boolean
        default: false
      recipient:
        description: "Override destination email (optional)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: daily-revenue-brief
  cancel-in-progress: false

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Compose and send the Daily Revenue Intelligence Brief
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_RECIPIENT_EMAIL: ${{ secrets.BRIEF_RECIPIENT_EMAIL }}
          GMAIL_FROM_USER: ${{ secrets.GMAIL_FROM_USER }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            if [ -n "${{ inputs.recipient }}" ]; then
              ARGS="$ARGS --recipient ${{ inputs.recipient }}"
            fi
          fi
          python scripts/send_daily_brief.py $ARGS
